[package]
name = "kaykit-arena"
version = "0.1.0"
edition = "2021"
description = "Server-authoritative arena prototype module (SpacetimeDB) for the browser client"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Same SpacetimeDB version as BitCraftServer/packages/*
spacetimedb = { version = "=2.10.0" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 's'
lto = true
